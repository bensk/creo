# Local development only. Staging and production use Cloud SQL.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: creo
      POSTGRES_PASSWORD: creo
      POSTGRES_DB: creo_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creo -d creo_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
